# Full suite against a local copy of the app (docs/brief.md §2.1, "CI").
# Needs the secret APP_REPO_TOKEN: a fine-grained token with Contents: read on
# ryanchynskyi/qa-interview-tests (the app repo is private).
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      app_ref:
        description: App branch, tag or SHA to test against
        default: main
  # The app changes on its own schedule: a nightly run catches UI changes the next morning.
  schedule:
    - cron: '0 4 * * *'
  # The app repo can trigger a run after its deploy:
  # gh api repos/ryanchynskyi/qa-hub-playwright/dispatches -f event_type=app-updated
  repository_dispatch:
    types: [app-updated]

# A new push to a PR cancels its older run; runs on main (push, nightly) always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_DIR: app
      # stack.mjs: an external Postgres (no embedded server); the API creates and seeds the DB.
      DB_URL: postgresql://postgres:postgres@localhost:5432/qahub_pw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ryanchynskyi/qa-interview-tests
          ref: ${{ inputs.app_ref || 'main' }}
          path: app
          token: ${{ secrets.APP_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: App version to the job summary
        run: echo "App \`$(git -C app rev-parse --short HEAD)\` (${{ inputs.app_ref || 'main' }})" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm run check
      # Browsers are cached per Playwright version; system libraries are installed every time.
      - id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # webServer in playwright.config.ts starts scripts/stack.mjs (API + built web app).
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
