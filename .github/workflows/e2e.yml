# Full suite against a local copy of the app (docs/brief.md §2.1, "CI").
# Needs the secret APP_REPO_TOKEN: a fine-grained token with Contents: read on
# ryanchynskyi/qa-interview-tests (the app repo is private).
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      app_ref:
        description: App branch, tag or SHA to test against
        default: main
  # The app's CI sends this after a green push to main or develop (specs/COVERAGE.md, I-3), with
  # client_payload {ref, sha}; the run then tests that exact app commit.
  repository_dispatch:
    types: [app-updated]

# A new push to a PR cancels its older run; runs on main always finish. Nightly: nightly.yml.
# App-triggered runs queue per app branch: GitHub keeps one pending run per group, so sharing the
# group with pushes to main would let an app commit replace a framework run (or the reverse).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.ref && format('app-{0}', github.event.client_payload.ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_DIR: app
      # Manual input, else the app commit that triggered the run, else the app's main.
      APP_REF: ${{ inputs.app_ref || github.event.client_payload.sha || 'main' }}
      APP_BRANCH: ${{ github.event.client_payload.ref || inputs.app_ref || 'main' }}
      # stack.mjs: an external Postgres (no embedded server); the API creates and seeds the DB.
      DB_URL: postgresql://postgres:postgres@localhost:5432/qahub_pw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ryanchynskyi/qa-interview-tests
          ref: ${{ env.APP_REF }}
          path: app
          token: ${{ secrets.APP_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: App version to the job summary
        run: echo "App \`$(git -C app rev-parse --short HEAD)\` ($APP_BRANCH, ${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm run check
      # Browsers are cached per Playwright version; system libraries are installed every time.
      - id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # webServer in playwright.config.ts starts scripts/stack.mjs (API + built web app).
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
